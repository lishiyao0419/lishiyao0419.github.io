Games.p15={
  start(api){
    this.ez=api.ez;this.N=4;
    const board=node('<div class="p15 dom-board" id="p15Board" style="width:min(400px,92vw)"></div>');
    api.stage.append(board);
    api.stage.append(node('<div class="hint-line">点击空格旁的数字，或用方向键，把数字按 1 到 N 排好</div>'));
    let arr,moves,sec,timer,started;
    api.hud({'步数':{id:'moves',v:0},'用时':{id:'time',v:'0:00'},'最佳步数':{id:'best',v:'-',cls:'gold'}});
    api.actions([{t:'3×3',fn:()=>this.newGame(3)},{t:'4×4',cls:'btn-primary',fn:()=>this.newGame(4)},{t:'打乱重开',fn:()=>this.newGame(this.N)}]);
    this.newGame=N=>{
      this.N=N;arr=Array.from({length:N*N},(_,i)=>i);moves=0;sec=0;started=false;clearInterval(timer);
      for(let k=0;k<N*N*40;k++){const b=arr.indexOf(0),neighbors=this.neighbors(b);this.swap(b,choice(neighbors));}
      board.style.gridTemplateColumns='repeat('+N+',1fr)';
      api.setHud('moves',0);api.setHud('time','0:00');
      const best=api.bestGet()||{};api.setHud('best',best[N]||'-');this.render();api.hideOverlay();
    };
    this.neighbors=i=>{const N=this.N,x=i%N,y=i/N|0,a=[];
      if(x>0)a.push(i-1);if(x<N-1)a.push(i+1);if(y>0)a.push(i-N);if(y<N-1)a.push(i+N);return a;};
    this.swap=(a,b)=>{[arr[a],arr[b]]=[arr[b],arr[a]];};
    this.try=t=>{
      const b=arr.indexOf(0);if(!this.neighbors(b).includes(t))return;
      if(!started){started=true;timer=setInterval(()=>{sec++;api.setHud('time',fmtTime(sec));},1000);this.ez.interval(timer);}
      this.swap(b,t);moves++;api.setHud('moves',moves);Sfx.play('move');this.render();
      if(arr.slice(0,-1).every((v,i)=>v===i+1)&&arr[arr.length-1]===0)this.win();
    };
    this.render=()=>{
      const N=this.N;
      board.innerHTML=arr.map((v,i)=>v===0?'<div></div>':'<button class="p15-tile" data-i="'+i+'" style="aspect-ratio:1;font-size:'+(N===4?'clamp(16px,5vw,23px)':'clamp(20px,7vw,30px)')+'">'+v+'</button>').join('');
      $$('.p15-tile',board).forEach(t=>this.ez.on(t,'click',()=>this.try(+t.dataset.i)));
    };
    this.win=()=>{clearInterval(timer);Sfx.play('win');
      const best=api.bestGet()||{};const isNew=!best[this.N]||moves<best[this.N];if(isNew){best[this.N]=moves;api.bestSave(best);}
      $$('.p15-tile',board).forEach(t=>t.classList.add('solved'));
      api.overlay('<h3>拼图完成</h3><div class="big-score">'+moves+' 步</div><p>用时 '+fmtTime(sec)+(isNew?'，刷新最佳步数！':'，最佳 '+best[this.N]+' 步')+'</p><div class="row"><button class="btn btn-primary" id="ovRe">再来一局</button></div>');
      $('#ovRe').onclick=()=>this.newGame(this.N);
    };
    this.ez.on(document,'keydown',e=>{
      if(!arr)return;const N=this.N,b=arr.indexOf(0),x=b%N,y=b/N|0;let t=-1;
      if(e.key==='ArrowLeft'&&x<N-1)t=b+1;if(e.key==='ArrowRight'&&x>0)t=b-1;
      if(e.key==='ArrowUp'&&y<N-1)t=b+N;if(e.key==='ArrowDown'&&y>0)t=b-N;
      if(t>=0){e.preventDefault();this.try(t);}
    });
    this.newGame(4);
  },
  stop(){}
};

/* ============================================================
   打地鼠
   ============================================================ */
Games.whack={
  start(api){
    this.ez=api.ez;
    const grid=node('<div class="whack-grid"></div>');
    for(let i=0;i<9;i++){
      const hole=node('<div class="hole" data-i="'+i+'"><div class="mole"><span class="eye l"></span><span class="eye r"></span><span class="nose"></span><span class="teeth"></span></div><span class="hit-fx">+1</span></div>');
      this.ez.on(hole,'pointerdown',()=>this.hit(i));grid.append(hole);
    }
    api.stage.append(grid);
    api.stage.append(node('<div class="hint-line">金色地鼠 +3 分，普通地鼠 +1 分；30 秒内尽可能多敲</div>'));
    let holes,score,left,spawnT,popT,running,timer;
    api.hud({'得分':{id:'score',v:0,cls:'accent'},'剩余秒':{id:'left',v:30},'最高':{id:'best',v:api.bestGet()||0,cls:'gold'}});
    api.actions([{t:'开始游戏',cls:'btn-primary',fn:()=>this.startGame()}]);
    holes=$$('.hole',grid);
    this.startGame=()=>{
      score=0;left=30;running=true;api.setHud('score',0);api.setHud('left',30);api.hideOverlay();
      holes.forEach(h=>{h.classList.remove('bonked');$('.mole',h).className='mole';});
      clearInterval(timer);timer=setInterval(()=>{left--;api.setHud('left',left);if(left<=0)this.end();},1000);this.ez.interval(timer);
      this.loop();
    };
    this.loop=()=>{
      if(!running)return;
      const up=holes.filter(h=>$('.mole',h).classList.contains('up'));
      if(up.length<2&&Math.random()<.85){
        const free=holes.filter(h=>!$('.mole',h).classList.contains('up'));
        if(free.length){const h=choice(free),m=$('.mole',h),gold=Math.random()<.18;
          m.className='mole up'+(gold?' golden':'');h.dataset.g=gold?'3':'1';
          if(gold){m.style.background='radial-gradient(circle at 50% 30%,#FFE9A3,#E0A93E)';$('.hit-fx',h).textContent='+3';}
          else{m.style.background='';$('.hit-fx',h).textContent='+1';}
          popT=setTimeout(()=>m.classList.remove('up'),rnd(650,1100)-left*9);this.ez.timer(popT);
        }
      }
      spawnT=setTimeout(()=>this.loop(),rnd(280,620)-left*5);this.ez.timer(spawnT);
    };
    this.hit=i=>{
      if(!running)return;const h=holes[i],m=$('.mole',h);
      if(!m.classList.contains('up'))return;
      const g=+h.dataset.g;score+=g;api.setHud('score',score);Sfx.play('hit');
      m.classList.add('hit');m.classList.remove('up');h.classList.add('bonked');
      const fx=$('.hit-fx',h);setTimeout(()=>h.classList.remove('bonked'),420);
      setTimeout(()=>m.classList.remove('hit'),200);
    };
    this.end=()=>{
      running=false;clearTimeout(spawnT);clearTimeout(popT);Sfx.play('win');
      holes.forEach(h=>$('.mole',h).classList.remove('up'));
      const best=api.bestGet()||0;const isNew=score>best;if(isNew){api.bestSave(score);api.setHud('best',score);}
      api.overlay('<h3>时间到</h3><div class="big-score">'+score+'</div><p>'+(isNew?'刷新最高纪录！':'最高纪录 '+best)+'</p><div class="row"><button class="btn btn-primary" id="ovRe">再来一局</button></div>');
      $('#ovRe').onclick=()=>this.startGame();
    };
    api.overlay('<h3>打地鼠</h3><p>地鼠会随机冒头，露头时间越来越短。点中得分，金色地鼠分值更高。</p><div class="row"><button class="btn btn-primary" id="ovGo">开始游戏</button></div>');
    $('#ovGo').onclick=()=>this.startGame();
  },
  stop(){}
};
/* ============================================================
   井字棋（极小极大 AI）
   ============================================================ */
Games.ttt={
  start(api){
    this.ez=api.ez;
    const grid=node('<div class="ttt-grid"></div>');
    for(let i=0;i<9;i++)grid.append(node('<button class="ttt-cell" data-i="'+i+'"></button>'));
    api.stage.append(grid);
    api.stage.append(node('<div class="hint-line">你执 X 先手；困难模式 AI 永不落败，简单模式会偶尔失误</div>'));
    let b,turn,busy,hard=true,me='X',rec=api.bestGet()||{w:0,l:0,d:0};
    const XSVG='<svg viewBox="0 0 24 24" fill="none" stroke="#5EE6FF" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>';
    const OSVG='<svg viewBox="0 0 24 24" fill="none" stroke="#FF6BA8" stroke-width="2.6"><circle cx="12" cy="12" r="7.5"/></svg>';
    api.hud({'胜':{id:'w',v:rec.w,cls:'accent'},'负':{id:'l',v:rec.l},'平':{id:'d',v:rec.d}});
    api.actions([{t:'重开一局',cls:'btn-primary',fn:()=>this.reset()},{t:'难度：困难',id:'diff',fn:()=>this.toggleDiff()},{t:'交换先手',fn:()=>this.swap()}]);
    this.toggleDiff=()=>{hard=!hard;$$('#hudActions button')[1].textContent='难度：'+(hard?'困难':'简单');toast(hard?'已切换困难模式':'已切换简单模式');};
    this.swap=()=>{me=me==='X'?'O':'X';toast('你现在执 '+me);this.reset();};
    const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    const winner=x=>{for(const l of lines){const[a,b1,c]=l;if(x[a]&&x[a]===x[b1]&&x[a]===x[c])return{w:x[a],l};}return x.every(v=>v)?{w:'D'}:null;};
    this.reset=()=>{b=Array(9).fill(null);turn='X';busy=false;this.draw();};
    this.draw=winL=>{$$('.ttt-cell',grid).forEach((c,i)=>{c.innerHTML=b[i]==='X'?XSVG:b[i]==='O'?OSVG:'';c.classList.toggle('filled',!!b[i]);c.classList.toggle('win',winL&&winL.includes(i));});};
    this.place=(i,who)=>{b[i]=who;Sfx.play('click');this.draw();const r=winner(b);if(r)return this.end(r);};
    this.human=i=>{if(busy||b[i]||turn!==me)return;this.place(i,me);if(winner(b))return;turn=me==='X'?'O':'X';busy=true;setTimeout(()=>this.ai(),420);};
    this.ai=()=>{
      const ai=me==='X'?'O':'X';let i;
      if(!hard&&Math.random()<.35){const free=b.map((v,k)=>v?null:k).filter(v=>v!==null);i=choice(free);}
      else{let best=-1e9;i=0;b.forEach((v,k)=>{if(v)return;b[k]=ai;const s=this.mini(b,false,ai);b[k]=null;if(s>best){best=s;i=k;}});}
      this.place(i,ai);if(winner(b)){busy=false;return;}turn=me;busy=false;
    };
    this.mini=(x,isMax,ai)=>{
      const r=winner(x);if(r){if(r.w==='D')return 0;return r.w===ai?10:-10;}
      const who=isMax?ai:(ai==='X'?'O':'X');let best=isMax?-1e9:1e9;
      x.forEach((v,k)=>{if(v)return;x[k]=who;const s=this.mini(x,!isMax,ai);x[k]=null;best=isMax?Math.max(best,s):Math.min(best,s);});
      return best;
    };
    this.end=r=>{
      busy=true;const wl=r.l;
      if(r.w==='D'){rec.d++;Sfx.play('move');}
      else if(r.w===me){rec.w++;Sfx.play('win');}else{rec.l++;Sfx.play('lose');}
      api.bestSave(rec);api.setHud('w',rec.w);api.setHud('l',rec.l);api.setHud('d',rec.d);
      this.draw(wl);
      setTimeout(()=>{
        api.overlay('<h3>'+(r.w==='D'?'平局':r.w===me?'你赢了！':'AI 获胜')+'</h3><div class="row"><button class="btn btn-primary" id="ovRe">再来一局</button></div>');
        $('#ovRe').onclick=()=>{this.reset();api.hideOverlay();};
      },500);
    };
    $$('.ttt-cell',grid).forEach(c=>this.ez.on(c,'click',()=>this.human(+c.dataset.i)));
    this.reset();
  },
  stop(){}
};

/* ============================================================
   五子棋（启发式 AI）
   ============================================================ */
Games.gomoku={
  start(api){
    this.ez=api.ez;
    const N=13,S=32,cv=node('<canvas width="'+(N*S)+'" height="'+(N*S)+'" style="max-width:94vw"></canvas>');
    const ctx=cv.getContext('2d');
    api.stage.append(cv);
    api.stage.append(node('<div class="hint-line">你执黑先手，横、竖或斜方向连成五子即胜；AI 执白</div>'));
    let b,busy,winLine,history;
    api.hud({'步数':{id:'moves',v:0}});
    api.actions([{t:'悔棋',fn:()=>this.undo()},{t:'重新开局',cls:'btn-primary',fn:()=>this.reset()}]);
    this.reset=()=>{b=Array.from({length:N*N},()=>0);busy=false;winLine=null;history=[];api.setHud('moves',0);this.draw();api.hideOverlay();};
    const inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
    const val=(x,y)=>inb(x,y)?b[y*N+x]:-1;
    this.scoreDir=(x,y,dx,dy,c)=>{
      let cnt=1,ends=0;
      let i=1;while(val(x+dx*i,y+dy*i)===c){cnt++;i++;}if(val(x+dx*i,y+dy*i)===0)ends++;
      i=1;while(val(x-dx*i,y-dy*i)===c){cnt++;i++;}if(val(x-dx*i,y-dy*i)===0)ends++;
      if(cnt>=5)return 1e7;
      if(cnt===4)return ends===2?120000:ends===1?10000:0;
      if(cnt===3)return ends===2?9000:ends===1?800:0;
      if(cnt===2)return ends===2?140:ends===1?18:0;
      return ends===2?4:1;
    };
    this.eval=(x,y,c)=>{const D=[[1,0],[0,1],[1,1],[1,-1]];return D.reduce((s,d)=>s+this.scoreDir(x,y,d[0],d[1],c),0);};
    this.aiMove=()=>{
      let best=-1,moves=[];
      for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(b[y*N+x])continue;
        let near=false;for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++)if(val(x+dx,y+dy)===1||val(x+dx,y+dy)===2){near=true;break;}
        if(!near)continue;
        const off=this.eval(x,y,2),def=this.eval(x,y,1),v=off*1.05+def*.96+Math.random()*4;
        if(v>best){best=v;moves=[[x,y]];}else if(v===best)moves.push([x,y]);
      }
      if(!moves.length)return[6,6];
      return choice(moves);
    };
    this.checkWin=(x,y,c)=>{
      const D=[[1,0],[0,1],[1,1],[1,-1]];
      for(const[dx,dy]of D){const line=[[x,y]];
        for(const s of[1,-1]){let i=1;while(val(x+dx*i*s,y+dy*i*s)===c){line.push([x+dx*i*s,y+dy*i*s]);i++;}}
        if(line.length>=5)return line.slice(0,5);}
      return null;
    };
    this.draw=()=>{
      const W=N*S;ctx.fillStyle='#10182E';ctx.fillRect(0,0,W,W);
      ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1;
      for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(S/2+i*S,S/2);ctx.lineTo(S/2+i*S,W-S/2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(S/2,S/2+i*S);ctx.lineTo(W-S/2,S/2+i*S);ctx.stroke();}
      [[3,3],[9,3],[3,9],[9,9],[6,6]].forEach(([x,y])=>{ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(S/2+x*S,S/2+y*S,3,0,7);ctx.fill();});
      for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=b[y*N+x];if(!v)continue;
        ctx.beginPath();ctx.arc(S/2+x*S,S/2+y*S,S*.4,0,7);
        ctx.fillStyle=v===1?'#1A2238':'#E9EDFA';ctx.fill();
        ctx.strokeStyle=v===1?'#000':'rgba(0,0,0,.25)';ctx.lineWidth=1.5;ctx.stroke();}
      const last=history[history.length-1];
      if(last){ctx.strokeStyle='#FF6B7A';ctx.lineWidth=2;ctx.beginPath();ctx.arc(S/2+last[0]*S,S/2+last[1]*S,S*.18,0,7);ctx.stroke();}
      if(winLine){ctx.strokeStyle='#FFB454';ctx.lineWidth=3;
        winLine.forEach(([x,y])=>{ctx.beginPath();ctx.arc(S/2+x*S,S/2+y*S,S*.46,0,7);ctx.stroke();});}
    };
    this.place=(x,y,c)=>{b[y*N+x]=c;history.push([x,y]);api.setHud('moves',history.length);
      const w=this.checkWin(x,y,c);this.draw();if(w){winLine=w;this.draw();this.finish(c);return true;}return false;};
    this.human=e=>{
      if(busy||winLine)return;const r=cv.getBoundingClientRect();
      const x=Math.round(((e.clientX-r.left)/r.width*W()-0.5)),y=Math.round(((e.clientY-r.top)/r.height*W()-0.5));
      if(!inb(x,y)||b[y*N+x])return;Sfx.play('click');
      if(this.place(x,y,1))return;busy=true;
      setTimeout(()=>{const[ax,ay]=this.aiMove();this.place(ax,ay,2);busy=false;},260);
    };
    const W=()=>N*S;
    this.undo=()=>{
      if(busy)return;if(history.length<2)return toast('没有可悔的棋');
      history.splice(-2);const nb=Array.from({length:N*N},()=>0);history.forEach(([x,y],i)=>nb[y*N+x]=i%2===0?1:2);
      b=nb;winLine=null;this.draw();Sfx.play('move');
    };
    this.finish=c=>{Sfx.play(c===1?'win':'lose');
      setTimeout(()=>{api.overlay('<h3>'+(c===1?'黑棋胜利，你赢了！':'白棋胜利，AI 更胜一筹')+'</h3><div class="row"><button class="btn btn-primary" id="ovRe">再来一局</button></div>');
      $('#ovRe').onclick=()=>this.reset();},350);
    };
    this.ez.on(cv,'click',e=>this.human(e));
    this.reset();
  },
  stop(){}
};

/* ============================================================
   数独（回溯生成 + 唯一解保证）
   ============================================================ */
Games.sudoku={
  start(api){
    this.ez=api.ez;
    const grid=node('<div class="sudoku-grid"></div>');
    for(let i=0;i<81;i++){const y=i/9|0;const c=node('<div class="sd-cell" data-i="'+i+'"></div>');if(y===2||y===5)c.classList.add('br');grid.append(c);}
    const pad=node('<div class="numpad"></div>');
    for(let n=1;n<=9;n++)pad.append(node('<button data-n="'+n+'">'+n+'</button>'));
    pad.append(node('<button data-n="0" style="grid-column:span 2">擦除</button>'));
    pad.append(node('<button id="sdHint" style="grid-column:span 2">提示</button>'));
    pad.append(node('<button id="sdCheck" style="grid-column:span 1">检查</button>'));
    api.stage.append(grid,pad);
    api.stage.append(node('<div class="hint-line">点格子再点数字填入；同行、列、宫内不能重复</div>'));
    let sol,puz,cur,sel,diff='m',sec,timer;
    api.hud({'用时':{id:'time',v:'0:00'},'难度':{id:'diff',v:'中等'},'剩余':{id:'left',v:0}});
    api.actions([{t:'简单',fn:()=>this.gen('e')},{t:'中等',cls:'btn-primary',fn:()=>this.gen('m')},{t:'困难',fn:()=>this.gen('h')},{t:'新题',fn:()=>this.gen(diff)}]);
    const cands=(b,i)=>{const x=i%9,y=i/9|0;const used=new Set;
      for(let k=0;k<9;k++){used.add(b[y*9+k]);used.add(b[k*9+x]);used.add(b[((y/3|0)*3+(k/3|0))*9+(x/3|0)*3+k%3]);}
      const a=[];for(let v=1;v<=9;v++)if(!used.has(v))a.push(v);return a;};
    const mrv=b=>{let bi=-1,bc=null;
      for(let i=0;i<81;i++){if(b[i])continue;const c=cands(b,i);if(!c.length)return[-1,null];if(!bc||c.length<bc.length){bi=i;bc=c;if(c.length===1)break;}}
      return[bi,bc];};
    /* 填入一个完整解并保留在 b 中 */
    const fillFull=b=>{const[bi,bc]=mrv(b);if(bi===-1)return true;
      for(const v of shuffle(bc.slice())){b[bi]=v;if(fillFull(b))return true;b[bi]=0;}return false;};
    /* 统计解的数量，超过 1 即提前终止 */
    const countSol=b=>{let sols=0;(function rec(){
      if(sols>1)return;const[bi,bc]=mrv(b);if(bi===-1){sols++;return;}
      for(const v of bc){b[bi]=v;rec();b[bi]=0;if(sols>1)return;}
    })();return sols;};
    this.gen=level=>{
      diff=level;const target={e:38,m:47,h:55}[level];
      sol=Array(81).fill(0);fillFull(sol);
      const b=sol.slice(),order=shuffle([...Array(81).keys()]);let holes=0;
      for(const i of order){if(holes>=target)break;const back=b[i];b[i]=0;
        if(countSol(b.slice())!==1)b[i]=back;else holes++;}
      puz=b.slice();cur=b.slice();sel=null;sec=0;clearInterval(timer);
      timer=setInterval(()=>{sec++;api.setHud('time',fmtTime(sec));},1000);this.ez.interval(timer);
      api.setHud('diff',{e:'简单',m:'中等',h:'困难'}[level]);api.setHud('left',81-holes?holes:holes);this.countLeft();this.render();api.hideOverlay();
    };
    this.countLeft=()=>api.setHud('left',cur.filter(v=>!v).length);
    this.conflicts=()=>{
      const bad=new Set;
      const check=cells=>{const seen={};cells.forEach(i=>{if(!cur[i])return;(seen[cur[i]]=seen[cur[i]]||[]).push(i);});
        Object.values(seen).forEach(a=>{if(a.length>1)a.forEach(i=>bad.add(i));});};
      for(let k=0;k<9;k++){check([...Array(9)].map((_,j)=>k*9+j));check([...Array(9)].map((_,j)=>j*9+k));
        check([...Array(9)].map((_,j)=>((k/3|0)*3+(j/3|0))*9+(k%3)*3+j%3));}
      return bad;
    };
    this.render=()=>{
      const bad=this.conflicts();
      $$('.sd-cell',grid).forEach((c,i)=>{
        c.className='sd-cell'+((i/9|0)===2||(i/9|0)===5?' br':'');
        c.textContent=cur[i]||'';
        if(puz[i])c.classList.add('given');else if(cur[i])c.classList.add('user');
        if(sel===i)c.classList.add('sel');
        else if(sel!=null){const sx=sel%9,sy=sel/9|0,x=i%9,y=i/9|0;
          if(x===sx||y===sy||((x/3|0)===(sx/3|0)&&(y/3|0)===(sy/3|0)))c.classList.add('peer');}
        if(bad.has(i))c.classList.add('err');
      });
    };
    this.fillN=n=>{
      if(sel==null)return toast('先选择一个格子');if(puz[sel])return;
      cur[sel]=n||0;Sfx.play('click');this.countLeft();this.render();
      if(cur.every(v=>v)&&this.conflicts().size===0)this.win();
    };
    this.win=()=>{clearInterval(timer);Sfx.play('win');
      api.overlay('<h3>数独完成</h3><div class="big-score">'+fmtTime(sec)+'</div><p>'+{e:'简单',m:'中等',h:'困难'}[diff]+'难度，全部填写正确</p><div class="row"><button class="btn btn-primary" id="ovRe">再来一题</button></div>');
      $('#ovRe').onclick=()=>this.gen(diff);};
    $$('.sd-cell',grid).forEach(c=>this.ez.on(c,'click',()=>{sel=+c.dataset.i;Sfx.play('click');this.render();}));
    $$('button',pad).forEach(b2=>this.ez.on(b2,'click',()=>{if(b2.dataset.n!==undefined)this.fillN(+b2.dataset.n);}));
    this.ez.on($('#sdHint'),'click',()=>{if(sel==null)return toast('先选择一个空格');if(puz[sel]||cur[sel]===sol[sel])return;cur[sel]=sol[sel];this.countLeft();this.render();Sfx.play('merge');if(cur.every(v=>v)&&this.conflicts().size===0)this.win();});
    this.ez.on($('#sdCheck'),'click',()=>{const bad=this.conflicts();toast(bad.size?('还有 '+bad.size+' 个冲突格'):'目前没有冲突，继续加油');});
    this.ez.on(document,'keydown',e=>{if(e.key>='1'&&e.key<='9')this.fillN(+e.key);if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')this.fillN(0);
      if(sel!=null){const x=sel%9,y=sel/9|0;let nx=x,ny=y;
        if(e.key==='ArrowLeft')nx--;if(e.key==='ArrowRight')nx++;if(e.key==='ArrowUp')ny--;if(e.key==='ArrowDown')ny++;
        if(nx>=0&&nx<9&&ny>=0&&ny<9){sel=ny*9+nx;this.render();}}});
    this.gen('m');
  },
  stop(){}
};

/* 启动 */
route();
